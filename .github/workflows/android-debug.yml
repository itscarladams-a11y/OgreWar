name: Ogre War Android release gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ogre-war-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            'platform-tools' \
            'build-tools;35.0.1' \
            'platforms;android-35' \
            'cmdline-tools;latest' \
            'cmake;3.10.2.4988404' \
            'ndk;28.1.13356709'

      - name: Cache Godot editor and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: ogre-war-godot-4.7.2-${{ runner.os }}

      - name: Install Godot 4.7.2
        run: bash tools/codespaces_setup.sh

      - name: Run release-candidate checks
        run: bash tools/verify_codespaces.sh

      - name: Build Android debug APK
        run: bash tools/build_android_debug.sh

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Ogre-War-Android-debug
          path: build/Ogre-War-debug.apk
          if-no-files-found: error
